global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # GPU 指标（DCGM Exporter）
  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['dcgm-exporter:9400']

  # 主机指标（node-exporter）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
